name: 기능
description: 새 기능이나 개선. 사람이 해도, 에이전트에게 맡겨도 바로 시작할 수 있게.
title: "[기능] "
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 에이전트에게 주는 지시서이기도 하다. **기능 하나**만 담고, 끝났는지 확인할 수 있게 쓴다.
        큰 일은 이슈 여러 개로 나눈다. 공개 저장소이므로 회사 이름·내부 주소·키 같은 정보는 쓰지 않는다.
  - type: textarea
    id: why
    attributes:
      label: 배경과 목표
      description: 왜 필요한가, 무엇이 달라지나. 관련 설계 문서 절이 있으면 링크.
      placeholder: |
        방문자가 에이전트의 하루를 볼 수 없다. 에이전트를 누르면 오늘 한 일이 나오게 한다. (docs/plan.md 7절)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 할 것과 **하지 않을 것**. 에이전트가 범위를 넘지 않게 경계를 적는다.
      value: |
        **할 것**
        -

        **하지 않을 것**
        -
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 확인할 수 있는 문장으로. 테스트·명령·화면 상태 등.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 관련 파일·문서
      description: 어디부터 보면 되는지. 모르면 비워 둔다.
      placeholder: |
        - docs/plan.md 5.2절 (테이블 초안)
        - src/office/Agent.tsx
  - type: textarea
    id: images
    attributes:
      label: 참고 이미지
      description: 시안·레퍼런스·현재 화면. CLI에서는 `scripts/gh-image.sh 파일.png`로 올려 나온 마크다운을 붙인다.
  - type: dropdown
    id: who
    attributes:
      label: 누가 하나
      options:
        - 에이전트 (사람이 검토)
        - 사람
        - 같이
    validations:
      required: true
